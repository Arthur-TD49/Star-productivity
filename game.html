<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Tasker Pro - Dashboard</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --mac-bg: rgba(255, 255, 255, 0.7);
            --mac-border: rgba(255, 255, 255, 0.4);
            --accent: #007AFF;
            --success: #28cd41;
            --danger: #FF3B30;
            --surface: rgba(255, 255, 255, 0.3);
            --text-main: #1d1d1f;
        }

        body {
            background: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; color: var(--text-main);
        }

        /* Container principal avec effet de flou dynamique */
        .app-container {
            width: 95%; max-width: 1200px; height: 85vh;
            background: var(--mac-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 24px; border: 1px solid var(--mac-border);
            display: flex; flex-direction: column;
            box-shadow: 0 50px 100px rgba(0,0,0,0.15);
            animation: appAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes appAppear { from { opacity: 0; transform: scale(0.95) translateY(20px); } }

        /* Barre de titre élégante */
        .title-bar {
            height: 65px; display: flex; align-items: center; padding: 0 25px;
            background: rgba(255,255,255,0.2); border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .dots { display: flex; gap: 8px; width: 80px; }
        .dot { width: 13px; height: 13px; border-radius: 50%; transition: 0.2s; cursor: pointer; }
        .dot:hover { filter: brightness(0.8); }
        .red { background: #FF5F56; } .yellow { background: #FFBD2E; } .green { background: #27C93F; }

        .xp-container { flex: 1; margin: 0 40px; }
        .xp-label { font-size: 11px; font-weight: 700; color: #666; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .xp-bar { height: 10px; background: rgba(0,0,0,0.08); border-radius: 20px; overflow: hidden; }
        #xp-fill { height: 100%; background: linear-gradient(90deg, #007AFF, #5AC8FA); width: 0%; transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }

        .star-wallet { 
            background: rgba(255,255,255,0.8); padding: 8px 16px; border-radius: 14px; 
            font-weight: 800; color: #e67e22; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .main-layout { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar & Widgets */
        .sidebar { width: 240px; padding: 25px; background: rgba(255,255,255,0.15); border-right: 1px solid rgba(0,0,0,0.05); }
        .widget { 
            background: var(--surface); padding: 18px; border-radius: 20px; 
            margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.4); text-align: center;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .widget:hover { transform: scale(1.02); background: rgba(255,255,255,0.5); }
        .widget small { display: block; font-size: 10px; font-weight: 800; color: #888; margin-bottom: 6px; letter-spacing: 0.5px; }
        .widget span { font-size: 1.1rem; font-weight: 700; color: #333; }

        /* Colonnes Scrollables */
        .shop-column { width: 320px; padding: 25px; overflow-y: auto; border-right: 1px solid rgba(0,0,0,0.05); }
        .task-column { flex: 1; padding: 25px; overflow-y: auto; background: rgba(255,255,255,0.1); }

        h3 { font-size: 1.2rem; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        /* Cards Style Apple */
        .card { 
            background: rgba(255, 255, 255, 0.7); padding: 20px; border-radius: 18px; margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.5); transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(0,0,0,0.08); background: #ffffff; }

        .input-group { background: white; padding: 20px; border-radius: 20px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        input, select { 
            width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 12px; 
            border: 1px solid #eee; outline: none; transition: 0.2s; font-size: 14px;
        }
        input:focus { border-color: var(--accent); background: #f9f9f9; }

        .btn { 
            border: none; padding: 12px 18px; border-radius: 12px; cursor: pointer; 
            font-weight: 700; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--accent); color: white; width: 100%; }
        .btn-primary:hover { background: #0062cc; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); }
        .btn-success { background: var(--success); color: white; padding: 8px 15px; }
        .btn-ghost { background: transparent; color: #999; }
        .btn-ghost:hover { color: var(--danger); background: #fff1f0; }

        /* Toasts style iOS */
        #notify-stack { position: fixed; top: 30px; right: 30px; z-index: 2000; }
        .toast {
            background: rgba(255,255,255,0.8); backdrop-filter: blur(15px);
            padding: 15px 25px; border-radius: 18px; margin-bottom: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); border: 1px solid white;
            animation: toastIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes toastIn { from { transform: translateX(120%); opacity: 0; } }

        /* Floating Timer Animé */
        .timer-float {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(29, 29, 31, 0.9); backdrop-filter: blur(10px); color: white; 
            padding: 14px 28px; border-radius: 50px; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); z-index: 1000;
            animation: timerPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes timerPop { from { transform: translateX(-50%) translateY(100px); } }

        .badge { font-size: 11px; padding: 5px 10px; border-radius: 8px; font-weight: 800; background: #FFF9E6; color: #D4AF37; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body>

<div id="notify-stack"></div>
<div id="timer-ui" class="timer-float" style="display:none"></div>

<div class="app-container">
    <div class="title-bar">
        <div class="dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <div class="xp-container">
            <div class="xp-label">
                <span>NIVEAU <span id="lvl-badge">1</span></span>
                <span id="xp-text">0 / 150 XP</span>
            </div>
            <div class="xp-bar"><div id="xp-fill"></div></div>
        </div>
        <div class="star-wallet">
            <i data-lucide="sparkles" size="18"></i>
            <span id="starsDisplay">0</span>
        </div>
    </div>

    <div class="main-layout">
        <aside class="sidebar">
            <div class="widget">
                <small>RANG ACTUEL</small>
                <span id="rankName">Stagiaire</span>
            </div>
            <div class="widget">
                <small>OBJECTIF ÉTOILES</small>
                <span id="star-goal">Matinée productive</span>
            </div>
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn btn-ghost" onclick="resetData()" style="font-size: 10px; opacity: 0.5;">RÉINITIALISER</button>
            </div>
        </aside>

        <section class="shop-column">
            <h3><i data-lucide="shopping-cart" size="20" color="#007AFF"></i> Boutique</h3>
            
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
                    <div>
                        <div style="font-weight:700;">☕ Café / Snack</div>
                        <div style="font-size:11px; color:#888;">Pause courte (10m)</div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="buy(20, 'Pause Snack', 10)">20 ⭐</button>
            </div>

            <div class="card">
                <div style="font-weight:700;">🎧 Playlist Favorie</div>
                <div style="font-size:11px; color:#888; margin-bottom:12px;">Détente musicale (20m)</div>
                <button class="btn btn-primary" onclick="buy(40, 'Musique', 20)">40 ⭐</button>
            </div>

            <div class="card">
                <div style="font-weight:700;">🎮 Session Gaming</div>
                <div style="font-size:11px; color:#888; margin-bottom:12px;">Récompense Ultime (45m)</div>
                <button class="btn btn-primary" onclick="buy(150, 'Gaming', 45)">150 ⭐</button>
            </div>

            <div class="card" style="border: 2px solid var(--accent); background: rgba(0, 122, 255, 0.05);">
                <div style="font-weight:800; color:var(--accent); display: flex; align-items: center; gap: 5px;">
                    <i data-lucide="zap" size="14"></i> DEEP WORK
                </div>
                <div style="font-size:11px; color:#555; margin-bottom:12px;">Focus sans interruption (25m)</div>
                <button class="btn btn-primary" style="background:#1d1d1f" onclick="startFocus()">Lancer le Focus</button>
            </div>
        </section>

        <main class="task-column">
            <h3><i data-lucide="target" size="20" color="#28cd41"></i> Missions</h3>
            <div class="input-group">
                <input type="text" id="taskName" placeholder="Quelle est la prochaine étape ?">
                <div style="display:flex; gap:12px;">
                    <select id="taskValue">
                        <option value="20">Facile (+20 ⭐)</option>
                        <option value="50" selected>Intermédiaire (+50 ⭐)</option>
                        <option value="150">Priorité Haute (+150 ⭐)</option>
                    </select>
                    <button class="btn btn-primary" onclick="addTask()" style="width:60px; flex-shrink: 0;"><i data-lucide="plus"></i></button>
                </div>
            </div>
            <div id="taskList"></div>
        </main>
    </div>
</div>

<script>
    // État de l'application
    let stars = parseInt(localStorage.getItem('stars')) || 0;
    let xp = parseInt(localStorage.getItem('xp')) || 0;
    let lvl = parseInt(localStorage.getItem('lvl')) || 1;
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
    const ranks = ["Stagiaire", "Apprenti", "Expert", "Maître", "Légende", "Demi-Dieu"];

    const getNextLevelXP = () => lvl * 150;

    // Notifications élégantes
    function sendNotify(title, msg) {
        const stack = document.getElementById('notify-stack');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<strong>${title}</strong><div style="font-size:12px; color: #666; margin-top:4px;">${msg}</div>`;
        stack.appendChild(toast);
        
        setTimeout(() => {
            toast.style.transform = 'translateX(120%)';
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 500);
        }, 4000);
    }

    // Mise à jour de l'UI
    function updateUI() {
        const nextXP = getNextLevelXP();
        document.getElementById('starsDisplay').innerText = stars;
        document.getElementById('lvl-badge').innerText = lvl;
        document.getElementById('rankName').innerText = ranks[Math.min(lvl-1, 5)];
        document.getElementById('xp-text').innerText = `${xp} / ${nextXP} XP`;
        
        let progress = (xp / nextXP) * 100;
        document.getElementById('xp-fill').style.width = `${progress}%`;

        // Persistance
        localStorage.setItem('stars', stars);
        localStorage.setItem('xp', xp);
        localStorage.setItem('lvl', lvl);
        localStorage.setItem('tasks', JSON.stringify(tasks));
        
        renderTasks();
        lucide.createIcons();
    }

    function addTask() {
        const input = document.getElementById('taskName');
        const val = document.getElementById('taskValue');
        if (!input.value.trim()) {
            input.style.borderColor = 'var(--danger)';
            setTimeout(() => input.style.borderColor = '#eee', 1000);
            return;
        }
        tasks.push({ id: Date.now(), name: input.value, reward: parseInt(val.value) });
        input.value = '';
        sendNotify("Mission ajoutée", "À toi de jouer !");
        updateUI();
    }

    function completeTask(id) {
        const taskIndex = tasks.findIndex(t => t.id === id);
        const task = tasks[taskIndex];
        
        stars += task.reward;
        xp += Math.floor(task.reward / 2);

        // Gestion Level Up
        if (xp >= getNextLevelXP()) {
            xp -= getNextLevelXP();
            lvl++;
            sendNotify("🎉 LEVEL UP !", `Bienvenue au niveau ${lvl}`);
        }

        tasks.splice(taskIndex, 1);
        sendNotify("Mission Accomplie", `+${task.reward} ⭐ gagnées`);
        updateUI();
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        updateUI();
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = tasks.length === 0 ? 
            `<div style="text-align:center; padding: 40px; color:#aaa;">
                <i data-lucide="coffee" size="40" style="margin-bottom:10px; opacity:0.3;"></i>
                <p>Toutes les missions sont remplies !</p>
            </div>` : '';

        tasks.forEach(t => {
            const div = document.createElement('div');
            div.className = 'card';
            div.style.display = 'flex'; div.style.justifyContent = 'space-between'; div.style.alignItems = 'center';
            div.innerHTML = `
                <div>
                    <div style="font-weight:700; margin-bottom:4px;">${t.name}</div>
                    <span class="badge">⭐ ${t.reward}</span>
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-ghost" onclick="deleteTask(${t.id})"><i data-lucide="trash-2" size="18"></i></button>
                    <button class="btn btn-success" onclick="completeTask(${t.id})">Terminer</button>
                </div>`;
            list.appendChild(div);
        });
    }

    // Gestion Timer
    let activeInterval;
    function startTimer(label, mins) {
        const endTime = Date.now() + (mins * 60 * 1000);
        localStorage.setItem('timerEnd', endTime);
        localStorage.setItem('timerLabel', label);
        runTimerLogic();
    }

    function runTimerLogic() {
        const ui = document.getElementById('timer-ui');
        const endTime = localStorage.getItem('timerEnd');
        const label = localStorage.getItem('timerLabel');
        if (!endTime) return;

        clearInterval(activeInterval);
        ui.style.display = 'flex';
        activeInterval = setInterval(() => {
            const diff = endTime - Date.now();
            if (diff <= 0) {
                clearInterval(activeInterval);
                ui.style.display = 'none';
                localStorage.removeItem('timerEnd');
                sendNotify("⏳ Temps écoulé !", `${label} est terminé.`);
                return;
            }
            const m = Math.floor(diff / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            ui.innerHTML = `<i data-lucide="clock" size="18"></i> <span><b>${label.toUpperCase()}</b> — ${m}:${s<10?'0':''}${s}</span>`;
            lucide.createIcons();
        }, 1000);
    }

    function buy(cost, label, mins) {
        if (stars >= cost) {
            stars -= cost;
            startTimer(label, mins);
            sendNotify("Achat validé", `Bonne session de ${label} !`);
            updateUI();
        } else {
            sendNotify("Étoiles insuffisantes", "Continue de travailler pour débloquer ça !");
        }
    }

    function startFocus() {
        startTimer("Concentration", 25);
        sendNotify("Focus", "Mode Deep Work activé. Ne lâche rien !");
    }

    function resetData() {
        if(confirm("Réinitialiser toute ta progression ?")) {
            localStorage.clear();
            location.reload();
        }
    }

    // Initialisation
    updateUI();
    runTimerLogic();
</script>
</body>
</html>
